name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt

      # Each check reports even if an earlier one failed — one red step should
      # not hide the other two.
      - name: qualety
        run: qualety check
      - name: pytest
        if: ${{ !cancelled() }}
        run: pytest
      - name: mypy
        if: ${{ !cancelled() }}
        run: mypy
