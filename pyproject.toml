[project]
name = "taam"
version = "0.0.0"
description = "Personal preference learning for drinks. Beer first, domain-agnostic by design."
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
files = ["src", "scripts", "tests"]
# numpy/pandas ship stubs; scipy and sklearn do not, and vendoring stubs for a
# repo this size is not worth it. Revisit if a real type bug slips through.
ignore_missing_imports = true
